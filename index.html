<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gráfica 2 Cliques — Controle de pedidos</title><link rel="stylesheet" href="styles.css"></head><body><header><div class="brand"><div class="logo">2</div><div><b>Gráfica 2 Cliques</b><small>Controle de pedidos · Mauá - SP</small></div></div><div class="tools"><button id="privacy">Ocultar valores</button><button id="theme">☾</button><button id="refresh">↻</button><button class="primary" id="new">+ Novo pedido</button></div></header><div class="wrap"><section class="stats"><div><small>Pedidos ativos</small><b id="count">0</b></div><div><small>Valor já pago</small><b id="paid">R$ 0,00</b></div><div><small>A receber</small><b id="due">R$ 0,00</b></div><div><small>Ticket médio em andamento</small><b id="avg">R$ 0,00</b></div></section><div class="search"><input id="q" placeholder="Buscar cliente, WhatsApp, descrição, responsável..."></div><div id="central"></div><main id="board"></main><section class="links"><button id="quotes">Histórico de orçamentos</button><button id="reports">Relatório mensal</button><button id="materials">Compra de materiais</button><button id="backup">Backup</button><button id="trash">Lixeira</button></section></div><dialog id="modal"><form id="form"><h2 id="title">Novo pedido</h2><input type="hidden" id="id"><label>Cliente *<input id="client" required></label><label>WhatsApp<input id="phone"></label><label>Descrição *<textarea id="desc" required></textarea></label><div class="grid"><label>Responsável<select id="owner"><option>Lindemberg</option><option>Kimberly</option></select></label><label>Valor (R$)<input id="value" type="number" step=".01" min="0"></label><label>Pagamento<select id="payment"><option value="pending">Pendente</option><option value="paid">Pago</option></select></label><label>Sistema de vendas<select id="sales"><option value="no">Não lançado</option><option value="yes">Lançado</option></select></label><label>Pronto em<input id="due" type="date"></label><label>Exportação<input id="export" type="date"></label><label>Etapa<select id="status"><option value="waiting">Cliente em espera</option><option value="quote">Orçamento</option><option value="production">Produção</option><option value="finishing">Finalização</option><option value="notified">Cliente avisado</option><option value="done">Pedido retirado</option></select></label></div><div class="foot"><button type="button" id="cancel">Cancelar</button><button type="button" id="voice">🎙 Voz</button><button class="primary">Salvar</button></div></form></dialog><script src="app.js"></script></body></html>
